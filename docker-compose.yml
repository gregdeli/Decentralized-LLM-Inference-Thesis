services:
  head-server:
    image: decentralized-llm-thesis:latest
    command: python server/server.py
    # command: sleep infinity
    # network_mode: "host"
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      # - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      - NUM_LAYERS=16
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      # - OMP_NUM_THREADS=1
      # - MKL_NUM_THREADS=1
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 6G
        #   cpus: '16.0'
    # ports:
      # - "5678:5678"
      # - "9999:9999"

  intermidiate-server:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: sleep infinity
    # network_mode: "host"
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      # - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      # - NUM_LAYERS=4
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      # - BOOTSTRAP_NODE_ADDR=head-server:5001
      # - OMP_NUM_THREADS=1
      # - MKL_NUM_THREADS=1
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
        limits:
          memory: 10G
          # cpus: '1.0'
    # ports:
    #   - "5678:5678"  
      # - 9999:9999 

  tail-server:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: sleep infinity
    # network_mode: "host"
    environment:
      # - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      # - NUM_LAYERS=4
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=intermidiate-server:5001
      # - OMP_NUM_THREADS=1
      # - MKL_NUM_THREADS=1
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 10G
          # cpus: '2.0'
    depends_on:
      - head-server
      - intermidiate-server
    # ports:
      # - "5678:5678"
      # - 9999:9999 

  server-A:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: sleep infinity
    environment:
      # - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      # - NUM_LAYERS=5
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=tail-server:5001
      # - OMP_NUM_THREADS=1
      # - MKL_NUM_THREADS=1
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 8G
    depends_on:
      - head-server
      - intermidiate-server
    # ports:
    #   - "5678:5678"

  client:
    image: decentralized-llm-thesis:latest 
    # command: python dht_test.py 
    # command: python distributed_chatbot.py 
    # command: python client_gui.py 
    command: sleep infinity 
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct 
      # - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0 
      - BOOTSTRAP_NODE_ADDR=head-server:5001 
      # - OMP_NUM_THREADS=1
      # - MKL_NUM_THREADS=1
    volumes:
      - ./models:/models:ro
      - ./src:/app # To make live changes to the client gui code
    ports:
      - "8080:8080" # NiceGUI
      - "5678:5678"