services:
  head-server:
    build: .
    # command: python server/server.py
    command: sleep infinity
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B
      - NUM_LAYERS=8
      # - LAYERS_START_IDX=0
      # - IS_HEAD=True
      # - SUCCESSOR_ADDR=intermidiate-server:5001 
      - GRPC_PORT=5001
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/4001
    volumes:
      - ./models:/models:ro # Mount your local models directory into the container
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
    #   - "50051:50051" # host_port:container_port
      - "5678:5678"

