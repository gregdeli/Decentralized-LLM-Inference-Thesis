# Example Yaml apo gemini

# Model Configuration
model_name: "meta-llama/Llama-3.1-8B-Instruct" # As an example
# The lit-gpt path might be local if you clone the repo
lit_gpt_path: "/path/to/your/lit-gpt"

# Network Configuration
dht_listen_on: "/ip4/0.0.0.0/tcp/0"
dht_initial_peers: [] # Add bootstrap peer addresses here

# Server Configuration
server_memory_buffer_gb: 2 # Memory to leave free for KV Cache