services:
  worker-A:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 server/server.py
    # command: sleep infinity
    hostname: worker-A
    # network_mode: "host"
    environment:
      - MODEL_PATH=/${MODEL_PATH}
      - GRPC_PORT=5001
      - NUM_LAYERS=$NUM_LAYERS
      # - NUM_LAYERS=10
      - PROFILE=$PROFILE
      - QUANTIZE=$QUANTIZE
      - LOG_LEVEL=$LOG_LEVEL
      # - ADDED_DELAY=0.08
      # - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: 1
        #       capabilities: [gpu]
        limits:
          memory: 3.5G #11657M 
          # cpus: '8.0'
    ports:
      - "5671:5678"
      # - "9999:9999"

  worker-B:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 server/server.py
