      - PROFILE=$PROFILE
      - QUANTIZE=$QUANTIZE
      - LOG_LEVEL=$LOG_LEVEL
      # - ADDED_DELAY=0.08
      - BOOTSTRAP_NODE_ADDR=worker-A:5001
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
      #   reservations:
      #     devices:
      #       - driver: nvidia
      #         count: 1
      #         capabilities: [gpu]
        limits:
