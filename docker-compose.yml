services:
  worker-A:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 server/server.py
    # command: sleep infinity
    hostname: worker-A
    # network_mode: "host"
    environment:
      - MODEL_PATH=/${MODEL_PATH}
      - GRPC_PORT=5001
      - NUM_LAYERS=8
      - PROFILE=$PROFILE
      # - ADDED_DELAY=0.08
      # - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: 1
        #       capabilities: [gpu]
        limits:
          memory: 5G
        #   cpus: '16.0'
    ports:
      - "5671:5678"
      # - "9999:9999"

