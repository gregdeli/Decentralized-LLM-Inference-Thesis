services:
  head-server:
    image: decentralized-llm-thesis:latest
    command: python server/server.py
    # command: sleep infinity
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      - NUM_LAYERS=5
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
        limits:
          memory: 4G
    # ports:
    #   - "5678:5678"

  intermidiate-server:
    image: decentralized-llm-thesis:latest
    command: python server/server.py
    # command: sleep infinity
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      - NUM_LAYERS=5
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=head-server:5001
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
        limits:
          memory: 4G
    # ports:
      # - "5678:5678"  

  tail-server:
    image: decentralized-llm-thesis:latest
    command: python server/server.py
    # command: sleep infinity
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      - NUM_LAYERS=6
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=intermidiate-server:5001
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 3G
    depends_on:
      - head-server
      - intermidiate-server
    # ports:
    #   - "5678:5678"

  server-A:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: sleep infinity
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      # - NUM_LAYERS=6
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=tail-server:5001
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      - head-server
      - intermidiate-server
    # ports:
    #   - "5678:5678"

  client:
    image: decentralized-llm-thesis:latest
    # command: python dht_test.py 
    # command: python distributed_chatbot.py 
    command: sleep infinity
    environment:
      # - MODEL_PATH=/models/Llama-3.2-1B
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=tail-server:5001
    volumes:
      - ./models:/models:ro
    # ports:
    #   - "5678:5678"