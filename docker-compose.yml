services:
  head-server:
    image: decentralized-llm-thesis:latest
    command: python server/server.py
    # command: sleep infinity
    # network_mode: "host"
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      - NUM_LAYERS=14
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        # limits:
        #   memory: 4G
        #   cpus: '16.0'
    # ports:
      # - "5678:5678"
      # - "9999:9999"

  intermidiate-server:
    image: decentralized-llm-thesis:latest
    command: python server/server.py
    # command: sleep infinity
    # network_mode: "host"
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      - NUM_LAYERS=1
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=head-server:5001
      # - BOOTSTRAP_NODE_ADDR=DESKTOP-D93JOU9:5001
    volumes:
      - ./models:/models:ro 
    # deploy:
    #   resources:
        # limits:
          # memory: 4G
          # cpus: '1.0'
    # ports:
      # - "5678:5678"  
      # - 9999:9999 

