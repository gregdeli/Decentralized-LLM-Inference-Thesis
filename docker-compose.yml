      - LOG_LEVEL=$LOG_LEVEL
      # - ADDED_DELAY=0.08
      # - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      # - BOOTSTRAP_NODE_ADDR=worker-B:5001
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]
        limits:
          memory: 2G
          # cpus: '6.0'
    # depends_on:
      # - worker-A
      # - worker-B
    ports:
      - "5673:5678"
      # - 9999:9999 

