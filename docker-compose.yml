    environment:
      - MODEL_PATH=/${MODEL_PATH}
      - QUANTIZE=$QUANTIZE
      - LOG_LEVEL=$LOG_LEVEL
      # - GRPC_PORT=5001
      # - HOST_MADDRS=/ip4/0.0.0.0/tcp/0 
      # - BOOTSTRAP_NODE_ADDR=worker-A:5001
      # - BOOTSTRAP_NODE_ADDR=150.140.139.205:5001
