  tail-server:
    build: .
    command: python server/server.py
    # command: sleep infinity
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B
      - NUM_LAYERS=8
      - GRPC_ADDR=tail-server:5001
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=head-server:5001
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 4G
    # ports:
      # - "5678:5678"
    depends_on:
      - head-server

  client:
    build: .
    command: python dht_test.py 
    # command: sleep infinity
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=head-server:5001
    volumes:
      - ./models:/models:ro
    # ports:
    #   - "5678:5678"
    depends_on: 
      - head-server
      # - intermidiate-server
      - tail-server