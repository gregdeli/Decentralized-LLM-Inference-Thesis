    # command: sleep infinity
    # network_mode: "host"
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      - NUM_LAYERS=1
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=intermidiate-server:5001
      # - BOOTSTRAP_NODE_ADDR=DESKTOP-D93JOU9:5001
    volumes:
      - ./models:/models:ro
    # deploy:
    #   resources:
        # limits:
          # memory: 3G
          # cpus: '1.0'
    depends_on:
      - head-server
      - intermidiate-server
    # ports:
