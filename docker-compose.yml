services:
  head-server:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 server/server.py
    # command: sleep infinity
    hostname: head-server
    # network_mode: "host"
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      # - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      - NUM_LAYERS=3
      # - ADDED_DELAY=0.08
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: 1
        #       capabilities: [gpu]
        limits:
          memory: 6G
        #   cpus: '16.0'
    ports:
      - "5678:5678"
      # - "9999:9999"

  intermediate-server:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 server/server.py
    # command: sleep infinity
    # network_mode: "host"
    hostname: intermediate-server
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      # - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      - NUM_LAYERS=10
      - ADDED_DELAY=0.08
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=head-server:5001
    volumes:
      - ./models:/models:ro 
    deploy:
      resources:
        limits:
          memory: 3G
          # cpus: '1.0'
    # ports:
    #   - "5678:5678"  
      # - 9999:9999 

  tail-server:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 server/server.py
    # command: sleep infinity
    # network_mode: "host"
    hostname: tail-server
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      # - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      - NUM_LAYERS=3
      # - ADDED_DELAY=0.05
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=intermediate-server:5001
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 3G
          # cpus: '1.0'
    depends_on:
      - head-server
      - intermediate-server
    # ports:
    #   - "5678:5678"
      # - 9999:9999 

  server:
    image: decentralized-llm-thesis:latest
    # command: python server/server.py
    command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 server/server.py
    # command: sleep infinity
    hostname: server-1
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct
      # - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      - NUM_LAYERS=4
      # - ADDED_DELAY=0.08
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0
      - BOOTSTRAP_NODE_ADDR=tail-server:5001
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: 1
        #       capabilities: [gpu]
        limits:
          memory: 3G
    depends_on:
      - head-server
      - intermediate-server
    # ports:
    #   - "5678:5678"

  client:
    image: decentralized-llm-thesis:latest 
    # command: python dht_test.py 
    # command: python distributed_chatbot.py 
    # command: python client_gui.py 
    # command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 client_gui.py
    command: sleep infinity 
    hostname: client
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct 
      # - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0 
      - BOOTSTRAP_NODE_ADDR=head-server:5001 
    volumes:
      - ./models:/models:ro
      - ./src:/app # To make live changes to the client gui code
    ports:
      - "8080:8080" # NiceGUI
      - "5679:5678"

  client-A:
    image: decentralized-llm-thesis:latest 
    # command: python dht_test.py 
    # command: python distributed_chatbot.py 
    # command: python client_gui.py 
    # command: python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 client_gui.py
    command: sleep infinity 
    hostname: client
    environment:
      - MODEL_PATH=/models/Llama-3.2-1B-Instruct 
      # - MODEL_PATH=/models/Llama-3.2-3B-Instruct
      - HOST_MADDRS=/ip4/0.0.0.0/tcp/0 
      - BOOTSTRAP_NODE_ADDR=head-server:5001 
    volumes:
      - ./models:/models:ro
      - ./src:/app # To make live changes to the client gui code
    ports:
      - "8081:8080" # NiceGUI
      - "5680:5678"

